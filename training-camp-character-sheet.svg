    <path d="M151 327 Q157 331 163 327" fill="none" class="fine"/>
    <path d="M96 432 Q86 456 82 480 M214 432 Q224 456 228 480" fill="none" stroke="#59603f" stroke-width="8" opacity=".6"/>
