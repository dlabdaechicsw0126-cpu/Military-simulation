  </g>

  <!-- protagonist -->
  <g transform="translate(70 0)">
    <ellipse cx="155" cy="735" rx="83" ry="13" fill="#41473a" opacity=".15"/>
    <use href="#basic-uniform"/>
    <path d="M124 286 Q127 252 157 250 Q188 252 190 285 L185 326 Q178 352 156 354 Q132 351 125 326 Z" fill="#d9ad8c" class="ink"/>
