  <!-- Labels -->
  <g class="kr">
    <rect x="76" y="784" width="112" height="30" rx="15" fill="#46513d"/><text x="132" y="804" text-anchor="middle" class="rank">훈련병</text>
    <text x="76" y="850" class="name">주인공</text><text x="76" y="881" class="mood">이름은 플레이어가 정해요</text><text x="76" y="918" class="mood">처음의 긴장 · 달라지는 표정</text>

    <rect x="400" y="784" width="112" height="30" rx="15" fill="#46513d"/><text x="456" y="804" text-anchor="middle" class="rank">훈련병</text>
    <text x="400" y="850" class="name">김도윤</text><text x="400" y="881" class="mood">먼저 말을 건 동기</text><text x="400" y="918" class="mood">밝고 편하게 다가오는 성격</text>

    <rect x="724" y="784" width="112" height="30" rx="15" fill="#46513d"/><text x="780" y="804" text-anchor="middle" class="rank">훈련병</text>
    <text x="724" y="850" class="name">정하람</text><text x="724" y="881" class="mood">조용히 주변을 살피는 동기</text><text x="724" y="918" class="mood">마음을 열면 깊은 친구가 됨</text>

    <rect x="1048" y="784" width="112" height="30" rx="15" fill="#46513d"/><text x="1104" y="804" text-anchor="middle" class="rank">훈련병</text>
    <text x="1048" y="850" class="name">박재원</text><text x="1048" y="881" class="mood">승부욕 있고 반듯한 동기</text><text x="1048" y="918" class="mood">부딪힘도 이해도 선택에 달림</text>

    <rect x="1372" y="784" width="112" height="30" rx="15" fill="#46513d"/><text x="1428" y="804" text-anchor="middle" class="rank">중사</text>
    <text x="1372" y="850" class="name">이준혁</text><text x="1372" y="881" class="mood">훈련 교관</text><text x="1372" y="918" class="mood">엄격하지만 살피는 사람</text>
  </g>
  <text x="70" y="1013" class="kr" font-size="14" fill="#797b6b">※ 훈련병은 훈련소 시점의 호칭이며, 교관의 계급·역할은 이야기 설정입니다.</text>
</svg>
