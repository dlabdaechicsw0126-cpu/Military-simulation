    <path d="M146 328 Q157 340 170 328" fill="none" class="fine"/>
    <path d="M82 490 Q73 500 81 511 M228 490 Q237 500 229 511" fill="none" stroke="#d7a784" stroke-width="5" stroke-linecap="round"/>
    <path d="M212 459 Q242 444 253 423" fill="none" stroke="#777e51" stroke-width="12" stroke-linecap="round"/>
    <circle cx="255" cy="419" r="12" fill="#d7a784" class="fine"/>
    <path d="M248 412 Q257 400 268 407" fill="none" class="fine"/>
  </g>

  <!-- Jeong Haram -->
  <g transform="translate(718 0)">
    <ellipse cx="155" cy="735" rx="83" ry="13" fill="#41473a" opacity=".15"/>
    <use href="#basic-uniform"/>
    <path d="M124 286 Q127 252 157 250 Q188 252 190 285 L185 326 Q178 352 156 354 Q132 351 125 326 Z" fill="#d5a682" class="ink"/>
    <path d="M120 297 Q118 260 145 248 Q175 241 191 269 L188 290 Q171 281 158 283 Q136 295 120 297Z" fill="#242827" class="ink"/>
    <path d="M137 311 Q144 314 150 311 M164 311 Q171 314 177 311" fill="none" class="fine"/>
    <circle cx="145" cy="318" r="3" fill="#30352f"/><circle cx="170" cy="318" r="3" fill="#30352f"/>
    <path d="M148 333 Q157 328 166 333" fill="none" class="fine"/>
    <path d="M100 390 Q78 425 83 471 L101 482 L117 430 M210 390 Q231 425 226 471 L208 482 L193 430" fill="none" stroke="#687046" stroke-width="8" opacity=".55"/>
