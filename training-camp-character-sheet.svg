    <path d="M224 450 L252 446 M226 463 L255 459 M228 476 L253 473 M230 489 L258 485" fill="none" stroke="#899075" stroke-width="3"/>
    <path d="M213 492 Q221 487 226 494 L231 513 Q223 520 216 512Z" fill="#c99470" class="fine"/>
