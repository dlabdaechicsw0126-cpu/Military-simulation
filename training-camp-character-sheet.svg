    <circle cx="145" cy="317" r="3" fill="#30352f"/><circle cx="170" cy="317" r="3" fill="#30352f"/>
    <path d="M148 330 L164 330" fill="none" class="fine"/>
    <path d="M83 400 L108 410 L115 443 M227 400 L202 410 L195 443" fill="none" stroke="#59603f" stroke-width="8"/>
