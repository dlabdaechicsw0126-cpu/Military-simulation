  <g filter="url(#shadow)">
    <rect x="54" y="184" width="304" height="785" rx="24" fill="#fffdf7"/>
    <rect x="378" y="184" width="304" height="785" rx="24" fill="#fffdf7"/>
    <rect x="702" y="184" width="304" height="785" rx="24" fill="#fffdf7"/>
    <rect x="1026" y="184" width="304" height="785" rx="24" fill="#fffdf7"/>
    <rect x="1350" y="184" width="304" height="785" rx="24" fill="#fffdf7"/>
