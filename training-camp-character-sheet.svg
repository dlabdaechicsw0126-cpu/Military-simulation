<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1050" role="img" aria-labelledby="title desc">
  <title id="title">훈련소 적응 시뮬레이터 캐릭터 시트</title>
  <desc id="desc">이름을 정하지 않은 주인공 훈련병과 세 동기, 중사 교관을 그린 따뜻한 웹툰풍 캐릭터 시트</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f7f2e7"/><stop offset="1" stop-color="#e8e2d2"/></linearGradient>
    <linearGradient id="uniform" x2="0" y2="1"><stop stop-color="#8d9460"/><stop offset="1" stop-color="#656c40"/></linearGradient>
    <linearGradient id="trainer" x2="0" y2="1"><stop stop-color="#65724d"/><stop offset="1" stop-color="#414e38"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#384033" flood-opacity=".12"/></filter>
    <style>
      .kr { font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; }
      .ink { stroke: #30352f; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .fine { stroke: #45493b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .title { font-size: 39px; font-weight: 800; fill: #30352f; letter-spacing: -1px; }
      .subtitle { font-size: 17px; fill: #747663; }
      .name { font-size: 23px; font-weight: 800; fill: #30352f; }
      .rank { font-size: 15px; font-weight: 700; fill: #f5f0df; }
      .mood { font-size: 15px; fill: #707364; }
    </style>
    <g id="basic-uniform">
      <!-- boots and legs -->
      <path d="M117 535 L151 535 L147 701 Q143 716 137 730 L96 730 Q91 722 100 710 L114 690 Z" fill="#525641" class="ink"/>
      <path d="M159 535 L194 535 L197 690 L211 710 Q218 724 207 730 L166 730 Q159 721 159 706 Z" fill="#525641" class="ink"/>
      <path d="M99 710 Q115 716 139 708 L143 728 Q128 740 93 734 Q88 725 99 710Z" fill="#353a35" class="ink"/>
      <path d="M165 708 Q185 716 207 709 L216 729 Q207 740 169 734 Q161 726 165 708Z" fill="#353a35" class="ink"/>
      <!-- torso -->
      <path d="M122 363 Q139 350 155 350 Q174 350 191 363 L211 397 L199 547 Q155 565 109 547 L99 398 Z" fill="url(#uniform)" class="ink"/>
      <!-- sleeves -->
      <path d="M120 377 Q105 375 98 394 L80 469 Q77 485 90 493 L108 499 L130 428 Z" fill="#777e51" class="ink"/>
      <path d="M190 377 Q205 375 212 394 L229 469 Q232 485 219 493 L201 499 L180 428 Z" fill="#777e51" class="ink"/>
      <!-- hands -->
      <path d="M81 480 Q72 489 77 504 Q82 516 95 509 L106 494 Z" fill="#d7a784" class="fine"/>
      <path d="M228 480 Q237 489 232 504 Q227 516 214 509 L203 494 Z" fill="#d7a784" class="fine"/>
      <!-- neck and collar -->
      <path d="M141 336 L141 370 Q155 383 169 370 L169 336 Z" fill="#d3a17f" class="fine"/>
      <path d="M124 366 L143 358 L155 377 L137 394 L118 378 Z" fill="#c7c19d" class="fine"/>
      <path d="M186 366 L167 358 L155 377 L173 394 L192 378 Z" fill="#c7c19d" class="fine"/>
      <!-- pockets and buttons -->
      <path d="M117 419 L145 419 L144 449 L116 449 Z M165 419 L193 419 L194 449 L166 449 Z" fill="#737a4d" class="fine"/>
      <path d="M117 420 L131 430 L145 420 M165 420 L179 430 L193 420" fill="none" class="fine"/>
      <path d="M155 389 L155 530" fill="none" class="fine"/>
      <circle cx="155" cy="405" r="3" fill="#dad2aa"/><circle cx="155" cy="438" r="3" fill="#dad2aa"/><circle cx="155" cy="471" r="3" fill="#dad2aa"/><circle cx="155" cy="504" r="3" fill="#dad2aa"/>
      <!-- blank name strip -->
      <rect x="124" y="395" width="28" height="8" rx="3" fill="#d9d4b9"/>
      <rect x="159" y="395" width="28" height="8" rx="3" fill="#d9d4b9"/>
    </g>
  </defs>

  <rect width="1720" height="1050" fill="url(#paper)"/>
  <circle cx="1590" cy="85" r="120" fill="#ddd9c5" opacity=".38"/>
  <circle cx="115" cy="1000" r="180" fill="#d9ddc9" opacity=".34"/>
  <path d="M64 154 H1656" stroke="#d7d2c2" stroke-width="2"/>
  <text x="70" y="81" class="kr title">훈련소, 처음 만난 사람들</text>
  <text x="72" y="119" class="kr subtitle">선택에 따라 달라지는 표정과 관계 · 캐릭터 콘셉트 시트</text>
  <rect x="1452" y="57" width="194" height="46" rx="23" fill="#48513d"/>
  <text x="1549" y="86" text-anchor="middle" class="kr rank">적응 이야기 · 01</text>

